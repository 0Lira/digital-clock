<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
    <title>Flip Clock Digital</title>
  </head>
  <body>
    <main class="main">
      <section class="data">
        <h2 class="diaAtual"></h2>
      </section>

      <section class="box-relogio">
        <!-- Horas -->
        <div class="flip-card" id="hora-card">
          <div class="flip-card-inner">
            <div class="flip-card-front">
              <div class="numero" id="hora-front">00</div>
            </div>
            <div class="flip-card-back">
              <div class="numero" id="hora-back">00</div>
            </div>
          </div>
        </div>

        <div class="separador">:</div>

        <!-- Minutos -->
        <div class="flip-card" id="minuto-card">
          <div class="flip-card-inner">
            <div class="flip-card-front">
              <div class="numero" id="minuto-front">00</div>
            </div>
            <div class="flip-card-back">
              <div class="numero" id="minuto-back">00</div>
            </div>
          </div>
        </div>

        <div class="separador">:</div>

        <!-- Segundos -->
        <div class="flip-card" id="segundo-card">
          <div class="flip-card-inner">
            <div class="flip-card-front">
              <div class="numero" id="segundo-front">00</div>
            </div>
            <div class="flip-card-back">
              <div class="numero" id="segundo-back">00</div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
